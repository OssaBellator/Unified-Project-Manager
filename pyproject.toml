[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-project-manager"
version = "0.2.0"
# Public provider release identity; keep in sync with unified_project_manager.__version__.
description = "A package-manager-agnostic control plane for project discovery, health, and native workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Unified Project Manager contributors" }]
dependencies = []

[project.scripts]
upm = "unified_project_manager.root_entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]
