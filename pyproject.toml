[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-project-manager"
version = "0.1.0"
description = "A package-manager-agnostic control plane for project discovery and health."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Unified Project Manager contributors" }]
dependencies = []

[project.scripts]
upm = "unified_project_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
